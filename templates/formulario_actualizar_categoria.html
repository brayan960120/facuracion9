{% extends 'layout.html' %}

{% block contenido %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class=flashes>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
<form action="actualizar_categoria" method="post">
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="id">Id categoria</label>
            <input value= {{categoria.id}} type="text" class="form-control" id="id" name="id"  readonly >
        </div>
        
        
        <div class="form-group col-md-6">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" class="form-control">
              <option selected value="">Seleccione...</option>
              {% for categoria in categorias %}
                <option {% if categorias.id == producto.categoria %} selected {% endif %}  value="{{categoria.categoria}}">{{categoria.categoria}}</option>
              {% endfor %}
            </select>
          </div>
        
        <button type="submit" class="btn btn-primary">Actualizar</button>
    </div>
    <a href="/crear_categoria" class="btn btn-secondary">Crear categoría</a>

    {% endblock contenido %}
