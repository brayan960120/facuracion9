

{% block contenido %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class=flashes>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {% block titulo %}
        {{ titulo_pagina }}
      {% endblock %}
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

  <div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success" >
        <a class="navbar-brand" href="#">Inventtools</a>
    </nav>
  </div>
<form action="actualizar_cliente" method="post">
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="id">Id cliente</label>
            <input value= {{cliente.id}} type="text" class="form-control" id="id" name="id"  readonly >
        </div>
        <div class="form-group col-md-6">
            <label for="numero_identificacion">Numero de identificacion</label>
            <input value= {{cliente.numero_identificacion}} type="text" class="form-control" id="numero_identificacion" name="numero_identificacion" placeholder="123456789">
        </div>
        <div class="form-group col-md-6">
            <label for="nombre_completo">Nombre completo</label>
            <input value= {{cliente.nombre_completo}} type="text" class="form-control" id="nombre_completo" name="nombre_completo" placeholder="Nombre completo">
        </div>
        <div class="form-group col-md-6">
            <label for="direccion">Direccion</label>
            <input value= {{cliente.direccion}} type="text" class="form-control" id="direccion" name="direccion">
        </div>
        <div class="form-group col-md-6">
            <label for="telefono">Telefono</label>
            <input value= {{cliente.telefono}} type="text" class="form-control" id="telefono" name="telefono">
        </div>
        </div>
        <div class="form-group col-md-6">
            <label for="email">Email</label>
            <input value= {{cliente.email}} type="text" class="form-control" id="email" name="email">
        </div>
    <button type="submit" class="btn btn-primary">Actualizar</button>
</form>
{% endblock contenido %}
