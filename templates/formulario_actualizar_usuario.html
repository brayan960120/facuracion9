

{% block contenido %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class=flashes>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {% block titulo %}
        {{ titulo_pagina }}
      {% endblock %}
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
  <div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success" >
        <a class="navbar-brand" href="#">Inventtools</a>
    </nav>
  </div>
<form action="crear_usuario" method="post">
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="id">Id producto</label>
            <input value= {{usuario.id}} type="text" class="form-control" id="id" name="id"  readonly >
        </div>
        <div class="form-group col-md-6">
            <label for="nombre_completo">Nombre completo</label>
            <input value= {{usuario.nombre_completo}} type="text" class="form-control" id="nombre_completo" name="nombre_completo" placeholder="Nombre completo">
        </div>
        <div class="form-group col-md-6">
            <label for="email">Email</label>
            <input value= {{usuario.email}} type="text" class="form-control" id="email" name="email" placeholder="Email">
        </div>
        <div class="form-group col-md-6">
            <label for="contraseña">Contraseña</label>
            <input value= {{usuario.contraseña}} type="password" class="form-control" id="contraseña" name="contraseña" readonly">
        </div>
        <div class="form-group col-md-6">
            <label for="rol">Rol</label>
            <input value= {{usuario.rol}} type="text" class="form-control" id="rol" name="rol" placeholder="Rol">
        </div>
        
    <button type="submit" class="btn btn-success btn-sm">Actualizar</button>
</form>
{% endblock contenido %}
