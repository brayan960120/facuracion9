{% extends 'layout.html' %}

{% block contenido %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class=flashes>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
<form action="crear_categoria" method="post">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="categoria">Nombre categoria</label>
        <input type="text" class="form-control" id="categoria" name="categoria" placeholder="Nombre categoria">
      </div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:80px; height:30px; font-size:12px; padding:2px 8px;">Guardar</button>
</form>
{% endblock contenido %}
