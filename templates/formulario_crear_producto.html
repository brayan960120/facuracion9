{% extends 'layout.html' %}

{% block contenido %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class=flashes>
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}
<form action="crear_producto" method="post">
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="descripcion">Descripción Producto</label>
      <input type="text" class="form-control" id="descripcion" name="descripcion" placeholder="Descripción Producto">
    </div>
    <div class="form-group col-md-6">
      <label for="valor_unitario">Valor Unitario</label>
      <input type="number" class="form-control" id="valor_unitario" name="valor_unitario" placeholder="Valor Unitario">
    </div>
    

  </div>
  
  <div class="form-group col-md-6">
    <label for="unidad_medida">Unidad de Medida</label>
    <select id="unidad_medida" name="unidad_medida" class="form-control">
      <option value="" selected>Seleccione...</option>
      <option value="GRS">GRS</option>
      <option value="UND">UND</option>
      <option value="LTS">LTS</option>
    </select>
  </div>
  
  <div class="form-group col-md-6">
    <label for="cantida_stock">Cantidad Stock</label>
    <input type="number" class="form-control" id="cantida_stock" name="cantida_stock" placeholder="Cantidad en Stock">
  </div>
  <div class="form-group col-md-6">
    <label for="categoria">Categoria</label>
    <select id="categoria" name="categoria" class="form-control">
        <option value="" selected>Seleccione...</option>
          {% for categoria in categoria %}
            <option value="{{ categoria.id }}">{{ categoria.categoria }}</option>
          {% endfor %}
    </select>
    
  </div>
  
  <button type="submit" class="btn btn-primary" style="width:80px; height:30px; font-size:12px; padding:2px 8px;">Guardar</button>
</form>



{% endblock contenido %}
