<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    >

</head>

<body>

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card">

                <div class="card-header bg-danger text-white">
                    Nueva contraseña
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="form-group">

                            <label>
                                Nueva contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                Confirmar contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="confirmar_password"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Cambiar contraseña
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
